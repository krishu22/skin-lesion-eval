defaults:
  data: ham10000
  model: swin
  loss: ce
  train: default
  # Image-only by default. Override with metadata=concatenation,
  # metadata=hadamard, or metadata=self_cross_attention to fuse in the
  # per-image age/sex/localization metadata features.
  metadata: none

run_name: baseline
output_dir: outputs/baseline

# Shared across every run/ablation so all of them train/eval on the exact
# same lesion-level split, regardless of output_dir. Computed once, then
# reloaded from cache on every subsequent run.
splits_dir: outputs/splits

# Stratified (lesion-grouped) k-fold CV, off by default. When enabled, one
# invocation trains/evaluates exactly cv.fold_index — run once per fold.
cv:
  enabled: false
  n_folds: 5
  fold_index: 0
  seed: 42

# Off by default. Override with tta.enabled=true (e.g. on
# scripts/eval_isic2019_external.py) to average predictions over the same
# 8 TTA_VARIANTS/averaging used by scripts/run_tta.py on HAM10000 val,
# instead of a single center-cropped pass.
tta:
  enabled: false

wandb:
  project: ham10000
  tags: []
