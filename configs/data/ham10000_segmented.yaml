use_segmented: true

data_dir: ham10000_segmented
metadata_csv: HAM10000_metadata.csv
image_dirs:
  - HAM10000_images_part_1
  - HAM10000_images_part_2

classes: [nv, mel, bkl, bcc, akiec, vasc, df]

split:
  test_size: 0.20
  val_size: 0.125
  group_col: lesion_id
  seed: 42

image_size: 224

augmentation:
  use_random_resized_crop: true
  random_crop_pad: 32
  random_resized_crop_scale: [0.6, 1.0]
  random_resized_crop_ratio: [0.9, 1.1]
  h_flip: true
  h_flip_prob: 0.5
  v_flip: true
  v_flip_prob: 0.5
  rotation_degrees: 35
  color_jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.1
  random_erasing:
    prob: 0.25
    scale: [0.02, 0.2]

normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
