seed: 42
deterministic: true
batch_size: 32

optimizer:
  name: adamw
  lr: 2.0e-5
  weight_decay: 0.3

scheduler:
  name: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  # linear warmup in steps (will be converted to epochs automatically)
  warmup_steps: 500

max_epochs: 100
# Patience should span at least one scheduler restart cycle; increased to avoid
# early stopping right after a restart spike. Adjust as needed.
patience: 20
metric_for_best: balanced_accuracy

# Batch-level MixUp/CutMix (train split only). At most one is ever applied per
# batch, even if both are enabled — batch_prob is each one's share of batches.
mixup:
  enabled: false
  alpha: 0.2
  batch_prob: 0.3

cutmix:
  enabled: false
  alpha: 1.0
  batch_prob: 0.2