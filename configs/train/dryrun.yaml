seed: 42
deterministic: true
batch_size: 32

optimizer:
  name: adamw
  lr: 5.0e-5
  weight_decay: 0.1

scheduler:
  name: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  warmup_steps: 500

max_epochs: 2
# Short patience for dry run
patience: 2
metric_for_best: balanced_accuracy

# Batch-level MixUp/CutMix (train split only). At most one is ever applied per
# batch, even if both are enabled — batch_prob is each one's share of batches.
# Override from the CLI, e.g. train.mixup.enabled=true train.mixup.alpha=0.4
mixup:
  enabled: false
  alpha: 0.2
  batch_prob: 0.3

cutmix:
  enabled: false
  alpha: 1.0
  batch_prob: 0.2
